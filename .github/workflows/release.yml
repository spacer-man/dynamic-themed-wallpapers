name: Release

# Push a tag such as v0.1.0 to build a signed APK and publish it as a GitHub release.
# The signing key lives only in repository secrets; see docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DTW_KEYSTORE_PASSWORD: ${{ secrets.DTW_KEYSTORE_PASSWORD }}
      DTW_KEY_ALIAS: ${{ secrets.DTW_KEY_ALIAS }}
      DTW_KEY_PASSWORD: ${{ secrets.DTW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: The signing secrets must exist
        env:
          KEYSTORE_B64: ${{ secrets.DTW_KEYSTORE_BASE64 }}
        run: |
          for v in KEYSTORE_B64 DTW_KEYSTORE_PASSWORD DTW_KEY_ALIAS DTW_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing secret for $v (see docs/releasing.md)"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DTW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: The tag must match the app version
        run: |
          version="$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Only installs the SDK command-line tools; its default package list has the removed 'tools' package.
          packages: ''
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build the release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./node_modules/.bin/tauri android build --apk --target aarch64 --features sqlite-bundled

      - name: Verify the signature and name the files
        run: |
          apk="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          out="dynamic-themed-wallpapers-${GITHUB_REF_NAME}-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          cat "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
