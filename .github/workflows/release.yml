name: Release

# Three ways to release, all building a signed APK and attaching it to the release:
#  - push a tag such as v0.1.0;
#  - publish a release with a new tag on GitHub;
#  - run this workflow by hand (Actions -> Release -> Run workflow) on main: the tag is v<version from
#    tauri.conf.json>, created here together with the release.
# The signing key lives only in repository secrets; see docs/releasing.md.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

# Publishing a release on the website also pushes its tag, so both events can fire: keep one run.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DTW_KEYSTORE_PASSWORD: ${{ secrets.DTW_KEYSTORE_PASSWORD }}
      DTW_KEY_ALIAS: ${{ secrets.DTW_KEY_ALIAS }}
      DTW_KEY_PASSWORD: ${{ secrets.DTW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Release tag
        run: |
          version="$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != main ]; then echo "::error::run it on main"; exit 1; fi
            echo "TAG=v$version" >> "$GITHUB_ENV"
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: The signing secrets must exist
        env:
          KEYSTORE_B64: ${{ secrets.DTW_KEYSTORE_BASE64 }}
        run: |
          for v in KEYSTORE_B64 DTW_KEYSTORE_PASSWORD DTW_KEY_ALIAS DTW_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::missing secret for $v (see docs/releasing.md)"; exit 1; fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DTW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: The tag must match the app version and must not be released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $version in tauri.conf.json"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists: bump the version first"; exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          # Only installs the SDK command-line tools; its default package list has the removed 'tools' package.
          packages: ''
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # the default "enhanced" cache is a commercial service
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build the release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./node_modules/.bin/tauri android build --apk --target aarch64 --features sqlite-bundled

      - name: Verify the signature and name the files
        run: |
          apk="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          out="dynamic-themed-wallpapers-${TAG}-arm64.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          cat "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created on the website: add the files to it.
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            # A draft left over from the website gets published (no-op for a published one).
            gh release edit "$TAG" --draft=false
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Run by hand: the tag is created here, on the commit that was built.
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "$TAG" --generate-notes --verify-tag
          fi
