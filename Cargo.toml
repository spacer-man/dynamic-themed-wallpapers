[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/OWNER/dynamic-themed-wallpapers"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image decoding is painfully slow in debug builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2
